<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운때</title>
<meta name="description" content="사주로 타고난 '운'을 세우고, 타로로 지금의 '때'를 읽습니다.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* ──────────────────────────────────────────────────────────
     디자인 컨셉 : 미드나잇 코스모스 (Midnight Cosmos)
     딥 네이비 + 차콜 배경, 무광 골드 선(線), 세리프 타이포.
     사주 명식(한자)과 타로 카드를 같은 굵기의 금색 선화로 통일하고
     '때'의 흐름은 과거→현재→미래 타임라인 레일로 드러낸다.
     ────────────────────────────────────────────────────────── */
  :root {
    --bg:        #080B14;
    --bg-2:      #050710;
    --panel:     #0F1422;
    --panel-2:   #151B2C;
    --line:      #212A40;
    --line-2:    #2E3A57;
    --ink:       #E9ECF5;
    --ink-dim:   #A4AEC6;
    --ink-faint: #6A7590;
    --gold:      #C9A96A;
    --gold-hi:   #E7D2A0;
    --gold-lo:   #8C7749;
    --gold-film: rgba(201,169,106,.09);
    --silver:    #9FB3D1;
    --danger:    #D98F63;
    --radius: 14px;
    /* 본문 — Pretendard Variable (동적 서브셋: 쓰인 글자 묶음만 내려받는다) */
    --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
            "Apple SD Gothic Neo", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    /* 명조 — 워드마크와 한자 명식에만 쓴다. 웹폰트를 받지 않고 시스템 것으로 해결한다. */
    --serif: AppleMyungjo, "Noto Serif KR", "Noto Serif CJK KR", "Nanum Myeongjo",
             Batang, 바탕, serif;
    --mok: #7FBF9A; --hwa: #E08A72; --to: #D8BC7A; --geum: #AFC0DA; --su: #7E9FD9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse 90% 45% at 50% -8%,  #16203F 0%, transparent 62%),
      radial-gradient(ellipse 55% 35% at 88% 12%,  #101B33 0%, transparent 58%),
      radial-gradient(ellipse 70% 40% at 8% 45%,   #0D1526 0%, transparent 60%);
    background-attachment: fixed;
  }

  /* 별 — 배경 장식 */
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #stars i {
    position: absolute; display: block; border-radius: 50%;
    background: #fff; opacity: .5;
    animation: tw 5s ease-in-out infinite;
  }
  @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .65 } }
  @media (prefers-reduced-motion: reduce) { #stars i { animation: none } }

  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 56px 18px 90px; }

  /* ── 헤더 ───────────────────────────────────────────── */
  header { text-align: center; margin-bottom: 44px; }
  .moons { display: flex; justify-content: center; gap: 13px; margin-bottom: 20px; opacity: .85; }
  .moons svg { display: block; }
  h1 {
    font-family: var(--serif);
    font-size: 2.4rem; font-weight: 600; letter-spacing: .3em;
    margin: 0 0 6px; color: var(--gold-hi);
    text-indent: .3em;
  }
  h1 .dim { color: var(--gold-lo); }
  .rule { width: 52px; height: 1px; background: var(--gold-lo); margin: 14px auto; opacity: .7; }
  .sub { color: var(--ink-dim); font-size: .92rem; letter-spacing: .02em; margin: 0; }
  .sub b { color: var(--gold); font-weight: 600; }

  /* ── 공통 패널 ───────────────────────────────────────── */
  .panel {
    background: linear-gradient(180deg, var(--panel) 0%, #0C111D 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 26px 24px;
    margin-bottom: 20px;
  }
  .eyebrow {
    font-size: .72rem; font-weight: 700; letter-spacing: .2em;
    color: var(--gold); text-transform: uppercase;
    margin: 0 0 18px; padding-bottom: 13px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 9px;
  }
  .eyebrow::before {
    content: ""; width: 5px; height: 5px; flex: none;
    border: 1px solid var(--gold); transform: rotate(45deg);
  }

  /* ── 입력 ────────────────────────────────────────────── */
  .field { margin-bottom: 16px; }
  label { display: block; font-size: .82rem; color: var(--ink-dim); margin-bottom: 7px; letter-spacing: .02em; }
  optgroup { color: var(--ink-faint); font-style: normal; font-size: .82rem; }
  optgroup option { color: var(--ink); font-size: .95rem; }
  input[type=date], input[type=time], input[type=text], select {
    display: block;
    width: 100%; max-width: 100%; min-width: 0;
    padding: 12px 13px;
    background: var(--bg-2); color: var(--ink);
    border: 1px solid var(--line-2); border-radius: 9px;
    /* 16px 미만이면 iOS 사파리가 포커스 시 페이지를 확대해 화면 밖으로 밀어낸다 */
    font-size: 1rem; font-family: inherit; line-height: 1.4;
    color-scheme: dark;
    -webkit-appearance: none; appearance: none;
  }
  /* 날짜·시각 입력은 사파리가 고유 너비를 잡아 넘치는 일이 있어 눌러둔다 */
  input[type=date]::-webkit-date-and-time-value { text-align: left; margin: 0; }
  input[type=date]::-webkit-calendar-picker-indicator,
  input[type=time]::-webkit-calendar-picker-indicator { margin-left: auto; opacity: .55; }
  input:disabled { opacity: .4; }
  input:focus, select:focus { outline: 2px solid var(--gold-lo); outline-offset: 1px; }
  .row { display: flex; gap: 13px; }
  .row > * { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 9px; font-size: .87rem; color: var(--ink-dim); margin: 2px 0 14px; }
  .check input { width: 17px; height: 17px; accent-color: var(--gold); flex: none; }
  .check label { margin: 0; font-size: .87rem; }
  button.go {
    width: 100%; margin-top: 4px; padding: 16px;
    background: transparent; color: var(--gold-hi);
    border: 1px solid var(--gold-lo); border-radius: 10px;
    font-size: 1rem; font-weight: 700; letter-spacing: .26em; text-indent: .26em;
    cursor: pointer;
    transition: background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  button.go:hover { background: var(--gold-film); box-shadow: 0 0 22px rgba(201,169,106,.14); }
  button.go:active { transform: translateY(1px); }

  /* ── 결과 레일 ───────────────────────────────────────── */
  #out { display: none; }
  #out.show { display: block; animation: fade .5s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }

  .stage { position: relative; padding-left: 46px; padding-bottom: 8px; }
  .stage::before {                     /* 세로 레일 */
    content: ""; position: absolute; left: 15px; top: 34px; bottom: -12px;
    width: 1px; background: linear-gradient(180deg, var(--gold-lo), var(--line));
  }
  .stage:last-child::before { display: none; }
  .stage > .badge {
    position: absolute; left: 0; top: 4px;
    width: 31px; height: 31px; border-radius: 50%;
    border: 1px solid var(--gold-lo); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: .72rem; font-weight: 700; color: var(--gold);
  }
  .stage > .stitle {
    font-size: 1.08rem; font-weight: 700;
    color: var(--gold-hi); margin: 0 0 3px; letter-spacing: .06em;
  }
  .stage > .slead { margin: 0 0 16px; font-size: .84rem; color: var(--ink-faint); }

  /* 사주 기둥 */
  .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
  .pillar {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 6px 12px; text-align: center;
  }
  .pillar .lab { font-size: .72rem; color: var(--ink-faint); letter-spacing: .12em; margin-bottom: 8px; }
  .pillar .han { font-family: var(--serif); font-size: 1.55rem; font-weight: 600; line-height: 1.25; color: var(--gold-hi); }
  .pillar .kor { font-size: .75rem; color: var(--ink-dim); margin-top: 3px; }
  .pillar.void .han { color: var(--ink-faint); }

  /* 오행 막대 */
  .wx-cap { margin: 20px 0 8px; font-size: .78rem; color: var(--ink-faint); }
  .wx-bars { display: flex; flex-direction: column; gap: 7px; margin: 0 0 2px; }
  .wx-row { display: flex; align-items: center; gap: 10px; font-size: .82rem; }
  .wx-name { width: 22px; color: var(--ink-dim); flex: none; font-weight: 600; }
  .wx-track { flex: 1; height: 8px; background: var(--bg-2); border-radius: 4px; overflow: hidden; }
  .wx-fill { display: block; height: 100%; min-width: 2px; border-radius: 4px; transition: width .7s ease; }
  .wx-num { width: 16px; text-align: right; color: var(--ink-faint); font-variant-numeric: tabular-nums; flex: none; }

  /* 일간 */
  .daymaster { display: flex; align-items: flex-start; gap: 16px; }
  .dm-seal {
    width: 62px; height: 62px; flex: none; border: 1px solid var(--gold-lo); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 1.8rem; color: var(--gold-hi);
    background: var(--gold-film);
  }
  .dm-body h4 { margin: 0 0 2px; font-size: .95rem; font-weight: 700; color: var(--ink); line-height: 1.6; }
  .dm-body .tag { vertical-align: middle; }

  .tag {
    display: inline-block;
    font-size: .72rem; font-weight: 500; letter-spacing: .06em;
    background: var(--gold-film); color: var(--gold);
    padding: 1px 9px; border-radius: 20px; border: 1px solid rgba(201,169,106,.3);
    white-space: nowrap;
  }
  .prose { margin: 12px 0 0; font-size: .92rem; color: var(--ink); }
  .prose.dim { color: var(--ink-dim); font-size: .88rem; margin-top: 7px; }

  /* ── 카드 배열 고르기 — 세 칸 버튼 ──────────────────── */
  .spick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 14px; }
  .spick > * { min-width: 0; }
  .spick button {
    background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 11px;
    color: var(--ink-dim); font-family: inherit; font-size: 1rem; line-height: 1.35;
    padding: 12px 6px 11px; cursor: pointer; transition: all .15s ease;
  }
  .spick button b { display: block; font-weight: 700; color: var(--ink); }
  .spick button span { display: block; margin-top: 2px; font-size: .75rem; color: var(--ink-faint); }
  .spick button:hover { border-color: var(--gold-lo); }
  .spick button.on { border-color: var(--gold); background: var(--gold-film); }
  .spick button.on b { color: var(--gold-hi); }
  .pick-guide { margin: 0 0 14px; font-size: .88rem; color: var(--ink-dim); text-align: center; }

  /* ── 타로 카드 ───────────────────────────────────────── */
  .spread-head {
    display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
    margin: 0 0 4px; font-size: .95rem; font-weight: 700; color: var(--gold-hi);
  }
  .qline {
    margin: 0 0 16px; font-size: .89rem; color: var(--ink-dim);
    border-left: 2px solid var(--gold-lo); padding-left: 11px;
  }
  .qline b { color: var(--ink); font-weight: 600; }

  .draw { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .draw.one { grid-template-columns: minmax(0, 190px); justify-content: center; }
  .draw.five { grid-template-columns: repeat(5, 1fr); }

  /* 켈틱 크로스의 묶음 상자 */
  .branch { border: 1px solid var(--line); border-radius: 12px; padding: 13px 12px; background: rgba(255,255,255,.015); }
  .branch h5 {
    margin: 0 0 11px; font-size: .82rem; font-weight: 700; color: var(--gold);
    letter-spacing: .04em; text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* 묶음 배열 (켈틱 크로스) */
  .groups { display: grid; grid-template-columns: 3fr 2fr; gap: 13px; align-items: start; }
  .groups > * { min-width: 0; }
  .gcards { display: grid; gap: 7px; }
  .gcards.c3 { grid-template-columns: repeat(3, 1fr); }
  .gcards.c2 { grid-template-columns: repeat(2, 1fr); }
  /* 그리드 자식은 기본 min-width:auto 라 긴 카드 이름이 칸을 밀어낸다 */
  .draw > *, .bcards > *, .fork-branches > *, .branch { min-width: 0; }
  .tcard {
    position: relative; aspect-ratio: 5 / 8; min-width: 0;
    background: linear-gradient(165deg, var(--panel-2) 0%, #0B0F1B 100%);
    border: 1px solid var(--line-2); border-radius: 10px;
    padding: 12px 8px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  }
  .tcard::after {                      /* 안쪽 금선 테두리 */
    content: ""; position: absolute; inset: 5px; border: 1px solid rgba(201,169,106,.22);
    border-radius: 6px; pointer-events: none;
  }
  .tcard.rev { border-color: rgba(201,169,106,.28); }
  .tcard .tpos {
    font-size: .71rem; font-weight: 600; letter-spacing: .06em; color: var(--gold);
    line-height: 1.4; word-break: keep-all;
    padding: 0 20px;          /* 역방향 배지와 겹치지 않도록 양쪽으로 자리를 비운다 */
  }
  .tcard .tglyph { font-size: 1.9rem; line-height: 1; }
  .tcard.rev .tglyph { transform: rotate(180deg); }
  .tcard .tname { font-size: .85rem; font-weight: 600; line-height: 1.45; color: var(--ink); word-break: keep-all; }
  .tcard .tmeta { font-size: .7rem; color: var(--ink-faint); margin-top: 3px; }
  .tcard .trev {
    position: absolute; top: 8px; right: 7px; font-size: .64rem; letter-spacing: .04em;
    color: var(--gold); border: 1px solid rgba(201,169,106,.4); border-radius: 3px; padding: 0 4px; line-height: 1.5;
  }

  /* 자리마다 겹쳐 보기 (운때) */
  .cross { margin: 0 0 20px; }
  .cross .clab {
    display: flex; align-items: center; gap: 8px;
    font-size: .72rem; font-weight: 600; letter-spacing: .12em; color: var(--gold); margin-bottom: 7px;
  }
  .cross-lead { margin: 0 0 12px; font-size: .84rem; color: var(--ink-faint); }
  .cross-lead b { color: var(--ink-dim); font-weight: 600; }
  .crow { border-top: 1px solid var(--line); padding: 11px 0; }
  .crow:last-child { padding-bottom: 0; }
  .crow-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
  .crow-h b { font-size: .88rem; color: var(--ink); font-weight: 600; }
  .crow p { margin: 0; font-size: .85rem; color: var(--ink-dim); line-height: 1.75; }
  .crow p.same { color: var(--ink-faint); font-style: normal; }

  /* ── 운때 결론 — 결과에서 가장 먼저 보이는 한 줄 ─────────── */
  .answer {
    position: relative; text-align: center;
    border: 1px solid var(--gold); border-radius: 16px;
    background:
      radial-gradient(120% 140% at 50% 0%, rgba(201,169,106,.22), rgba(201,169,106,.05) 60%, transparent),
      var(--panel);
    box-shadow: 0 0 0 4px rgba(201,169,106,.07), 0 12px 40px rgba(0,0,0,.35);
    padding: 26px 22px 22px;
  }
  .answer::before, .answer::after {
    content: "\2726"; position: absolute; top: 13px;
    color: var(--gold-lo); font-size: .8rem; line-height: 1;
  }
  .answer::before { left: 16px; }
  .answer::after { right: 16px; }
  .answer-eyebrow {
    display: block; margin-bottom: 12px;
    font-size: .72rem; font-weight: 700; letter-spacing: .24em; color: var(--gold);
  }
  .answer-line {
    margin: 0; font-size: 1.42rem; font-weight: 700; line-height: 1.5;
    color: var(--gold-hi); word-break: keep-all;
  }
  .answer-card { display: block; margin-top: 13px; font-size: .78rem; color: var(--ink-faint); }

  /* 근거는 접어 둔다 */
  .more { margin-top: 12px; }
  .more > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid var(--line-2); border-radius: var(--radius);
    padding: 12px 14px; font-size: .86rem; color: var(--ink-dim);
    transition: border-color .15s ease, color .15s ease;
  }
  .more > summary::-webkit-details-marker { display: none; }
  .more > summary::after { content: "\25BE"; color: var(--gold-lo); }
  .more[open] > summary::after { content: "\25B4"; }
  .more > summary:hover { border-color: var(--gold-lo); color: var(--ink); }
  .more-body {
    margin-top: 10px; padding: 20px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  }

  /* ── 총평 ────────────────────────────────────────────── */
  .verdict p { margin: 0; font-size: .92rem; }
  .vrow { margin-bottom: 15px; }
  .vrow .clab {
    display: block; font-size: .73rem; font-weight: 600; letter-spacing: .12em;
    color: var(--gold); margin-bottom: 5px;
  }
  .vrow p { color: var(--ink-dim); }

  .overlap {
    border: 1px solid rgba(201,169,106,.32); background: var(--gold-film);
    border-radius: 12px; padding: 17px 18px; margin: 20px 0 0;
  }
  .overlap .clab {
    display: flex; align-items: center; gap: 8px;
    font-size: .72rem; font-weight: 700; letter-spacing: .16em; color: var(--gold); margin-bottom: 11px;
  }
  .overlap .clab::before {
    content: ""; width: 5px; height: 5px; flex: none;
    border: 1px solid var(--gold); transform: rotate(45deg);
  }
  .ol { padding-top: 13px; }
  .ol + .ol { border-top: 1px dashed var(--line-2); margin-top: 13px; }
  .ol:first-of-type { padding-top: 0; }
  .ol-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .ol-head .who { font-size: .8rem; font-weight: 700; color: var(--gold-hi); }
  .grade {
    font-size: .71rem; letter-spacing: .04em; padding: 1px 8px; border-radius: 20px;
    border: 1px solid currentColor;
  }
  .ol p { color: var(--ink); font-size: .94rem; line-height: 1.82; }
  .ol .evidence {
    margin-top: 6px; font-size: .79rem; color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  /* 결론 — 겹침 진단 · 갈래 조언 · 맺음을 한 줄기로 읽는다 */
  .final p { color: var(--ink); font-size: .95rem; line-height: 1.84; margin: 0; }
  .final p + p { margin-top: 11px; }
  .final b { color: var(--gold-hi); font-weight: 700; }
  .final .evidence {
    margin-top: 7px; font-size: .78rem; color: var(--ink-faint);
    font-variant-numeric: tabular-nums; line-height: 1.7;
  }
  .fpart + .fpart { margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--line-2); }
  .fhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }
  .fhead .who { font-size: .8rem; font-weight: 700; color: var(--gold-hi); }
  .fhead .fmark {
    font-size: .71rem; font-weight: 600; letter-spacing: .1em; color: var(--gold);
  }
  .ftime {
    margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--line);
    font-size: .9rem; color: var(--ink-dim); line-height: 1.8;
  }
  .ftime b { color: var(--gold-hi); }

  .redraw { margin: 10px 0 0; }

  footer {
    margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line);
    font-size: .78rem; color: var(--ink-faint); line-height: 1.9; text-align: center;
  }

  @media (max-width: 560px) {
    .wrap { padding: 36px 14px 64px; }
    h1 { font-size: 1.85rem; }
    .panel { padding: 20px 16px; }
    .stage { padding-left: 38px; }
    .stage::before { left: 13px; }
    .stage > .badge { width: 27px; height: 27px; font-size: .7rem; }
    .answer { padding: 24px 16px 20px; }
    .answer-line { font-size: 1.24rem; }
    .more-body { padding: 18px 14px; }
    .pillars { gap: 6px; }
    .pillar { padding: 11px 3px 9px; }
    .pillar .han { font-size: 1.22rem; }
    .draw { gap: 7px; }
    .tcard { padding: 10px 5px; }
    .tcard .tglyph { font-size: 1.45rem; }
    .tcard .tname { font-size: .72rem; }
    .groups { grid-template-columns: 1fr; }
    .branch { padding: 12px 9px; }
    .tcard .tpos { padding: 0 15px; letter-spacing: 0; }
    .tcard .trev { top: 6px; right: 5px; padding: 0 3px; }

  }

  /* 아주 좁은 화면(구형 iPhone SE 등)에서는 한 줄에 두 장까지만 */
  @media (max-width: 400px) {
    .gcards.c3 { grid-template-columns: repeat(2, 1fr); }
    .row { flex-direction: column; gap: 0; }
  }
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<div class="wrap">

  <header>
    <!-- 삭 → 상현 → 보름 → 하현 → 삭. 북반구에서 달은 오른쪽부터 차오르므로
         상현달(차는 쪽)이 오른쪽, 하현달(기우는 쪽)이 왼쪽이 밝다.
         sweep-flag 0 = 왼쪽 반원, 1 = 오른쪽 반원. -->
    <div class="moons" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="none" stroke="#8C7749"/></svg>
      <svg width="15" height="15" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="none" stroke="#8C7749"/><path d="M10 1.5a8.5 8.5 0 0 1 0 17z" fill="#C9A96A" opacity=".55"/></svg>
      <svg width="15" height="15" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="#C9A96A" opacity=".8"/></svg>
      <svg width="15" height="15" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="none" stroke="#8C7749"/><path d="M10 1.5a8.5 8.5 0 0 0 0 17z" fill="#C9A96A" opacity=".55"/></svg>
      <svg width="15" height="15" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="none" stroke="#8C7749"/></svg>
    </div>
    <h1>운<span class="dim">·</span>때</h1>
    <div class="rule"></div>
    <p class="sub">사주로 타고난 <b>운</b>을 세우고, 타로로 지금의 <b>때</b>를 읽습니다</p>
  </header>

  <!-- ── 입력 ───────────────────────────────────────────── -->
  <section class="panel">
    <h2 class="eyebrow">생년월일시</h2>

    <div class="row">
      <div class="field">
        <label for="birthdate">생년월일 (양력)</label>
        <input type="date" id="birthdate" min="1900-01-01" max="2100-12-31">
      </div>
      <div class="field">
        <label for="birthtime">태어난 시각</label>
        <input type="time" id="birthtime" step="600">
      </div>
    </div>

    <div class="check">
      <input type="checkbox" id="unknownHour">
      <label for="unknownHour">태어난 시각을 모릅니다 (시주를 빼고 삼주만 봅니다)</label>
    </div>


  </section>

  <!-- ── 카드 배열 ──────────────────────────────────────── -->
  <section class="panel">
    <h2 class="eyebrow">카드 배열</h2>
    <div class="spick" id="spread"></div>
    <p class="pick-guide">궁금한 일을 떠올리며 뽑으세요.</p>
    <button class="go" id="drawBtn">카드 뽑기</button>
  </section>

  <div id="out"></div>

  <footer>
    재미로 보는 페이지입니다. 진로·건강·재정 등 실제 결정의 근거로 삼지 마세요.<br>
    절기 시각표는 천문 계산으로 교차검증했고, 해석 문장은 창작입니다.
  </footer>

</div>

<!-- ?v= 는 캐시 무효화용. JS를 고치면 아래 세 곳과 필요버전을 함께 올린다. -->
<script src="saju-core.js?v=20261003a"></script>
<script src="tarot-data.js?v=20261003a"></script>
<script src="fortune-data.js?v=20261003a"></script>
<script>
(function () {
  'use strict';

  // 새로고침하면 브라우저가 이전 스크롤 위치를 되살린다. 첫 화면은 맨 위여야 한다.
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
  window.addEventListener('load', function () { window.scrollTo(0, 0); });

  var WX_COLOR = {
    목: 'var(--mok)', 화: 'var(--hwa)', 토: 'var(--to)',
    금: 'var(--geum)', 수: 'var(--su)', 태극: 'var(--gold)'
  };
  var GLYPH = { major: '✦', wands: '❋', cups: '☾', swords: '✧', pentacles: '✵' };
  var WX = ['목', '화', '토', '금', '수'];
  var 필요버전 = '20261003a';

  /** 브라우저가 예전 JS를 캐시해 두면 조용히 깨진다. 눌렀을 때 바로 알려준다. */
  function 버전확인() {
    var 낡음 = [];
    if (SajuCore.버전 !== 필요버전) 낡음.push('saju-core.js');
    if (TarotData.버전 !== 필요버전) 낡음.push('tarot-data.js');
    if (FortuneData.버전 !== 필요버전) 낡음.push('fortune-data.js');
    if (!낡음.length) return true;
    alert('브라우저에 예전 파일이 남아 있습니다 (' + 낡음.join(', ') + ').\n\n' +
          '강력 새로고침으로 해결됩니다.\n' +
          '  Mac: Cmd + Shift + R\n  Windows: Ctrl + Shift + R');
    return false;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ── 별 배경 ──────────────────────────────────────────
  (function stars() {
    var box = document.getElementById('stars'), html = '';
    for (var i = 0; i < 64; i++) {
      var sz = (Math.random() * 1.6 + 0.6).toFixed(2);
      html += '<i style="left:' + (Math.random() * 100).toFixed(2) + '%;top:' +
              (Math.random() * 100).toFixed(2) + '%;width:' + sz + 'px;height:' + sz +
              'px;animation-delay:' + (Math.random() * 5).toFixed(2) + 's"></i>';
    }
    box.innerHTML = html;
  }());

  // ── 초기값 ───────────────────────────────────────────
  // 연도만 올해로 띄우고 월·일·시각은 고정한다. 바꿀 자리가 연도 하나로 줄어든다.
  // 시각이 03:00인 이유 — 입력란이 10분 단위(step=600)라 02:57은 넣을 수 없다.
  // 진태양시 보정(-30분) 뒤 02:27도 02:30도 축시라 사주는 어차피 같다.
  var 기본월일 = '-01-19', 기본시각 = '03:00';
  (function 초기값() {
    document.getElementById('birthdate').value = new Date().getFullYear() + 기본월일;
    document.getElementById('birthtime').value = 기본시각;
  }());

  /** 78장에서 중복 없이 n장 + 정/역 */
  function 카드뽑기(n) {
    var deck = TarotData.DECK.slice(), picked = [];
    for (var i = 0; i < n; i++) {
      var idx = Math.floor(Math.random() * deck.length);
      picked.push({ card: deck.splice(idx, 1)[0], 역방향: Math.random() < 0.5 });
    }
    return picked;
  }

  // ── 카드 배열 고르기 ─────────────────────────────────
  // 세 칸 버튼. 배열 목록은 FortuneData.스프레드 가 단일 출처다.
  var 선택배열 = 'three-time';
  var spBox = document.getElementById('spread');

  function 배열그리기() {
    var h = '';
    FortuneData.스프레드.forEach(function (sp) {
      h += '<button type="button" data-sp="' + sp.id + '"' +
           (sp.id === 선택배열 ? ' class="on"' : '') + '>' +
           '<b>' + esc(sp.이름) + '</b><span>' + sp.장수 + '장</span></button>';
    });
    spBox.innerHTML = h;
    document.getElementById('drawBtn').textContent = '카드 ' + 현재스프레드().장수 + '장 뽑기';
  }
  spBox.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-sp]'); if (!b) return;
    선택배열 = b.getAttribute('data-sp');
    배열그리기();
  });
  function 현재스프레드() { return FortuneData.스프레드찾기(선택배열); }
  배열그리기();

  function pillarHTML(label, p) {
    if (!p) {
      return '<div class="pillar void"><div class="lab">' + label + '</div>' +
             '<div class="han">—</div><div class="kor">모름</div></div>';
    }
    return '<div class="pillar"><div class="lab">' + label + '</div>' +
           '<div class="han">' + esc(p.한자) + '</div>' +
           '<div class="kor">' + esc(p.한글) + '</div></div>';
  }

  function stage(no, title, lead, body, 맨몸) {
    return '<section class="stage"><div class="badge">' + no + '</div>' +
           '<h3 class="stitle">' + title + '</h3>' +
           (lead ? '<p class="slead">' + lead + '</p>' : '') +
           (맨몸 ? body : '<div class="panel">' + body + '</div>') + '</section>';
  }

  // ── STEP 01 · 운 (사주) ──────────────────────────────
  function 운HTML(saju, reading) {
    var b = '<div class="pillars">' +
      pillarHTML('년주', saju.사주.년주) + pillarHTML('월주', saju.사주.월주) +
      pillarHTML('일주', saju.사주.일주) + pillarHTML('시주', saju.사주.시주) + '</div>';

    var max = 1;
    WX.forEach(function (k) { if (saju.오행분포[k] > max) max = saju.오행분포[k]; });
    b += '<p class="wx-cap">여덟 글자에 오행이 몇 개씩 들었는지</p><div class="wx-bars">';
    WX.forEach(function (k) {
      var v = saju.오행분포[k];
      b += '<div class="wx-row"><span class="wx-name">' + k + '</span>' +
           '<span class="wx-track"><span class="wx-fill" style="width:' + (v / max * 100) +
           '%;background:' + WX_COLOR[k] + '"></span></span>' +
           '<span class="wx-num">' + v + '</span></div>';
    });
    b += '</div>';

    // 경고는 화면에 띄우지 않는다 (saju.경고 로는 계속 돌려받을 수 있다).

    b += '<div class="daymaster" style="margin-top:22px;padding-top:20px;border-top:1px solid var(--line)">' +
         '<div class="dm-seal">' + esc(saju.일간.한자) + '</div>' +
         '<div class="dm-body"><h4>일간 ' + esc(reading.일간.글자) + ' — ' + esc(reading.일간.별명) +
         ' <span class="tag">' + esc(saju.일간.오행) + '</span></h4>' +
         '<p class="prose" style="margin-top:6px">' + esc(reading.일간.글) + '</p></div></div>';
    b += '<p class="prose dim">' + esc(reading.오행.글) + '</p>';
    return b;
  }

  // ── STEP 02 · 때 (타로) ──────────────────────────────
  function tileHTML(c) {
    var g = c.종류 === '메이저' ? GLYPH.major : GLYPH[c.수트키];
    return '<div class="tcard' + (c.역방향 ? ' rev' : '') + '">' +
           (c.역방향 ? '<span class="trev">역</span>' : '') +
           '<div class="tpos">' + esc(c.위치) + '</div>' +
           '<div class="tglyph" style="color:' + (WX_COLOR[c.오행] || 'var(--gold)') + '">' + g + '</div>' +
           '<div><div class="tname">' + esc(c.본래이름) + '</div>' +
           '<div class="tmeta">' + esc(c.오행) + ' · ' + esc(c.음양) + '</div></div></div>';
  }

  // 여기(때)에서는 카드가 어느 자리에 어떻게 놓였는지만 보인다.
  // 카드 설명·흐름·판의 모양은 화면이 너무 길어져 뺐다 (사용자 요청).
  function 때HTML(reading) {
    var sp = reading.스프레드;
    var b = '<div class="spread-head">' + esc(sp.이름) + ' · ' + esc(sp.부제) +
            ' <span class="tag">' + sp.장수 + '장</span></div>';

    if (sp.레이아웃 === 'group' && sp.묶음) {
      b += '<div class="groups">';
      sp.묶음.forEach(function (g) {
        b += '<div class="branch"><h5>' + esc(g.이름) + '</h5>' +
             '<div class="gcards ' + (g.idx.length % 3 === 0 ? 'c3' : 'c2') + '">';
        g.idx.forEach(function (i) { if (reading.카드[i]) b += tileHTML(reading.카드[i]); });
        b += '</div></div>';
      });
      b += '</div>';
    } else {
      b += '<div class="draw ' + esc(sp.레이아웃) + '">';
      reading.카드.forEach(function (c) { b += tileHTML(c); });
      b += '</div>';
    }
    return b;
  }

  // ── STEP 03 · 운때 ───────────────────────────────────
  var GRADE_COLOR = { 과다: 'var(--hwa)', 적정: 'var(--mok)', 부족: 'var(--su)', 태극: 'var(--gold)' };

  function 운때HTML(reading) {
    var v = reading.총평;

    // 결론 한 줄 — 결과에서 가장 먼저 눈에 들어와야 하는 문장. 30자 이내.
    var b = '<div class="answer">' +
            '<span class="answer-eyebrow">운때 결론</span>' +
            '<p class="answer-line">' + esc(v.한줄) + '</p>' +
            '<span class="answer-card">결론 카드 \u300c' + esc(v.한줄카드) + '\u300d</span>' +
            '</div>';

    // 근거는 펼쳐서 본다. 처음부터 다 보이면 결론이 묻힌다.
    b += '<details class="more"><summary>왜 이런 결론인지 자세히</summary>' +
         '<div class="more-body verdict">';
    b += '<div class="vrow"><span class="clab">운 · 사주가 말하는 바탕</span>' +
         '<p>' + esc(v.운) + '</p></div>';
    b += '<div class="vrow"><span class="clab">때 · 타로가 말하는 흐름</span>' +
         '<p>' + esc(v.때) + '</p></div>';

    // 자리마다 그 카드가 내 사주에서 무엇이 되는지 — 여기가 겹치는 자리다
    if (reading.카드 && reading.카드.length) {
      b += '<div class="cross"><span class="clab">자리마다 겹쳐 보면</span>' +
           '<p class="cross-lead">내 일간은 <b>' + esc(reading.일간.글자) + '</b>(' +
           esc(reading.일간오행) + ')입니다. 각 자리의 카드가 나에게 무엇이 되는지 봅니다.</p>';
      var 본십성글 = {};
      reading.카드.forEach(function (c) {
        // 십성과 시제가 같으면 같은 문장이 나온다. 두 번 읽히게 두지 않는다.
        var 되풀이 = 본십성글[c.십성글];
        본십성글[c.십성글] = true;
        b += '<div class="crow"><div class="crow-h">' +
             '<span class="rpos">' + esc(c.위치) + '</span>' +
             '<b>' + esc(c.카드이름) + '</b>' +
             '<span class="tag">' + esc(c.오행) + ' → ' + esc(c.십성) +
             (c.십성뜻 ? '(' + esc(c.십성뜻) + ')' : '') + '</span></div>' +
             (되풀이 ? '<p class="same">앞 자리와 같은 관계입니다.</p>'
                     : '<p>' + esc(c.십성글) + '</p>') + '</div>';
      });
      b += '</div>';
    }

    // 결론 — 기운의 저울 · 결론 자리 진단 · 갈래 조언 · 맺음을 한 줄기로 읽는다.
    // 예전에는 셋으로 쪼개 라벨을 붙였더니, 읽고 나서도 '그래서 뭘 하라는 건가'가 남았다.
    b += '<div class="overlap final"><span class="clab">겹쳐서 내린 결론</span>';

    // (1) 뽑힌 카드의 기운을 타고난 여덟 자 위에 얹어 본다 — 운때의 출발점
    if (v.쏠림) {
      b += '<div class="fpart"><div class="fhead"><span class="fmark">기운의 저울</span>' +
           (v.쏠림.등급
             ? '<span class="grade" style="color:' + (GRADE_COLOR[v.쏠림.등급] || 'var(--gold)') +
               '">' + esc(v.쏠림.등급) + '</span>'
             : '') + '</div>' +
           '<p>' + esc(v.쏠림.글) + '</p>' +
           '<p class="evidence">' + esc(v.쏠림.근거) + '</p></div>';
    }

    // (2) 결론 자리의 카드가 내 사주에서 무엇이 되는가
    v.겹침.forEach(function (g) {
      b += '<div class="fpart"><div class="fhead">' +
           (g.라벨 ? '<span class="who">' + esc(g.라벨) + '</span>'
                   : '<span class="fmark">결론 자리</span>') +
           '<span class="tag">' + esc(g.십성) + (g.십성뜻 ? ' · ' + esc(g.십성뜻) : '') + '</span>' +
           (g.등급 === '태극' ? '' :
             '<span class="grade" style="color:' + (GRADE_COLOR[g.등급] || 'var(--gold)') + '">' +
             esc(g.등급) + '</span>') + '</div>' +
           '<p>' + esc(g.글) + '</p>' +
           '<p class="evidence">' + esc(g.근거) + '</p></div>';
    });

    // (3) 무엇을 물었느냐에 맞춘 조언 + (4) 맺음 — 이어지는 한 덩어리로 읽힌다
    b += '<div class="fpart"><div class="fhead"><span class="fmark">' +
         esc(v.갈래제목) + '</span></div>' +
         '<p>' + esc(v.갈래글) + '</p>';
    v.맺음.forEach(function (m) {
      b += '<p>' + (m.라벨 ? '<b>' + esc(m.라벨) + '</b> \u2014 ' : '') + esc(m.글) + '</p>';
    });
    if (v.시기문장) b += '<p class="ftime">' + esc(v.시기문장) + '</p>';
    b += '</div>';

    b += '</div>';            // .overlap
    b += '</div></details>';  // .more-body, .more
    return b;
  }

  function render(saju, reading) {
    var h = '';
    h += stage('01', '운 — 타고난 바탕',
               '태어난 순간의 하늘을 네 기둥으로 세웁니다.',
               운HTML(saju, reading));
    h += stage('02', '때 — 지금의 흐름',
               '78장에서 뽑은 ' + reading.스프레드.장수 + '장이 이렇게 놓였습니다.',
               때HTML(reading));
    // 운때는 패널로 감싸지 않는다 — 결론 상자가 다른 단과 다르게 보여야 한다
    h += stage('03', '운때 — 겹쳐 읽기', '', 운때HTML(reading), true);

    h += '<div class="redraw"><button type="button" class="go" id="redrawBtn">' +
         '같은 조건으로 다시 뽑기</button></div>';

    var out = document.getElementById('out');
    out.innerHTML = h;
    out.classList.add('show');
    out.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function 뽑기실행() {
    if (!버전확인()) return;

    var dateStr = document.getElementById('birthdate').value;
    if (!dateStr) { alert('생년월일을 입력해 주세요.'); return; }

    var sp = 현재스프레드();
    var unknown = document.getElementById('unknownHour').checked;
    var timeStr = document.getElementById('birthtime').value || '12:00';
    var dp = dateStr.split('-').map(Number);
    var tp = timeStr.split(':').map(Number);
    tp[1] = Math.round((tp[1] || 0) / 10) * 10;      // 10분 단위로 맞춘다
    if (tp[1] === 60) { tp[1] = 0; tp[0] = (tp[0] + 1) % 24; }

    var saju;
    try {
      saju = SajuCore.calc(
        { year: dp[0], month: dp[1], day: dp[2],
          hour: unknown ? 12 : tp[0], minute: unknown ? 0 : tp[1] },
        { tz: 'Asia/Seoul', unknownHour: unknown }
      );
    } catch (e) {
      alert('계산할 수 없는 날짜입니다: ' + e.message);
      return;
    }

    var draw = 카드뽑기(sp.장수);
    render(saju, FortuneData.조립(saju, draw, sp));
    document.getElementById('drawBtn').textContent = '다시 뽑기 (' + sp.장수 + '장)';
  }

  document.getElementById('drawBtn').addEventListener('click', 뽑기실행);
  // 결과 맨 아래의 다시 뽑기 버튼 — 맨 위로 올라가지 않아도 되도록
  document.getElementById('out').addEventListener('click', function (e) {
    if (e.target.closest('#redrawBtn')) 뽑기실행();
  });

  document.getElementById('unknownHour').addEventListener('change', function () {
    document.getElementById('birthtime').disabled = this.checked;
  });
})();
</script>
</body>
</html>
